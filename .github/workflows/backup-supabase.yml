# Cópia de segurança semanal da base de dados do Supabase.
# O repositório é público, por isso o ficheiro é CIFRADO (GPG, AES-256) antes de ser
# guardado como artefacto. Só quem tem BACKUP_PASSPHRASE o consegue abrir.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     ligação "Session pooler" do Supabase (Connect → Session pooler)
#   BACKUP_PASSPHRASE   frase longa e aleatória; guarde-a também fora do GitHub
#
# Restaurar: gpg --decrypt backup.sql.gz.gpg | gunzip | psql "<ligação>"

name: Backup Supabase

on:
  schedule:
    - cron: "0 3 * * 0" # domingos às 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirmar segredos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Defina SUPABASE_DB_URL e BACKUP_PASSPHRASE nos segredos do repositório."
            exit 1
          fi

      - name: Exportar e cifrar
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # pg_dump 17 (compatível com Postgres 15 e 17 do Supabase)
          docker run --rm -e DB_URL postgres:17-alpine \
            sh -c 'pg_dump "$DB_URL" --schema=public --schema=auth --no-owner --no-privileges' \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" \
                  -o "backup-$(date -u +%Y-%m-%d).sql.gz.gpg"
          ls -lh backup-*.gpg

      - name: Guardar artefacto (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: backup-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
