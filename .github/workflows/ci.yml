name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, testes e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários (Vitest)
        run: npm test

      - name: Browser do Playwright
        run: npx playwright install --with-deps chromium

      # Modo de demonstração (sem segredos): o playwright.config.ts arranca o build com o relógio fixo.
      # As capturas @visual não correm aqui (renderização das letras difere entre máquinas).
      - name: E2E (Playwright)
        run: npm run e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  base-de-dados:
    name: Migrações e testes SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Postgres 17 em Docker com o auth/storage do Supabase simulados (supabase/tests/_supabase_stub.sql).
      - run: bash scripts/db-test.sh
